[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MNIME-desktop"
version = "5.0.0"

description = "MNIME - Native, high-performance offline document suite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.5.0",
    "pypdf>=3.17.0",
    "Pillow>=10.0.0",
    "pdf2docx>=0.5.6",
    "pymupdf>=1.23.0",
    "numpy==2.5.3",
    "llama-cpp-python>=0.2.75",
    "faiss-cpu",
    "pandas",
    "torch==2.14.1",
    "pywin32",
    "winsdk==1.0.0.post10"
]

[project.scripts]
MNIME = "MNIME:main"

